<!DOCTYPE html>
<html lang="tr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAK Veri Girişi</title>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --text: #1d2433; --muted: #5d6779; --line: #dfe3ea;
    --accent: #1f5fae; --accent-soft: #e8f0fa; --ok: #1d7a46; --ok-soft: #e5f5ec;
    --warn: #8a5a00; --warn-soft: #fff4dc; --err: #b42318; --err-soft: #fdecea;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161d; --panel: #1b212b; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3441;
      --accent: #6ea8ff; --accent-soft: #1d2a3d; --ok: #5cc98a; --ok-soft: #173024;
      --warn: #f0c060; --warn-soft: #33290f; --err: #ff8a80; --err-soft: #3a1a18; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161d; --panel: #1b212b; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3441;
    --accent: #6ea8ff; --accent-soft: #1d2a3d; --ok: #5cc98a; --ok-soft: #173024;
    --warn: #f0c060; --warn-soft: #33290f; --err: #ff8a80; --err-soft: #3a1a18; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .kap { max-width: 920px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .demo { background: var(--warn-soft); color: var(--warn); padding: 8px 12px; border-radius: var(--radius);
    margin: 12px 0 0; font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 16px; }
  .profil { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sekmeler { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); }
  .sekme { background: none; border: 0; padding: 10px 14px; font: inherit; color: var(--muted); cursor: pointer;
    border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .sekme[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .kart { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; cursor: pointer; font: inherit; color: inherit; transition: border-color .15s, transform .15s; }
  .kart:hover, .kart:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  .kart .s { font-size: 22px; }
  .kart b { display: block; margin-top: 6px; }
  .kart span.a { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .geri { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 0; margin-bottom: 8px; }
  .form-baslik { display: flex; align-items: center; gap: 10px; }
  .form-baslik .s { font-size: 26px; }
  .form-baslik h2 { margin: 0; }
  .uyari { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 12px 0; font-size: 14px; }
  .alanlar { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-top: 14px; }
  .alan.genis { grid-column: 1 / -1; }
  .alan[hidden] { display: none; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  label .z { color: var(--err); margin-left: 2px; }
  .ipucu { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  textarea { min-height: 78px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .hata-alan input, .hata-alan select, .hata-alan textarea { border-color: var(--err); background: var(--err-soft); }
  .aralik { display: flex; gap: 8px; align-items: center; }
  .butonlar { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btn { font: inherit; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); }
  .btn.ana { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  :root[data-theme="dark"] .btn.ana { color: #0b1220; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ana { color: #0b1220; } }
  .btn:disabled { opacity: .6; cursor: progress; }
  .mesaj { border-radius: 8px; padding: 12px 14px; margin-top: 14px; }
  .mesaj.ok { background: var(--ok-soft); color: var(--ok); }
  .mesaj.hata { background: var(--err-soft); color: var(--err); }
  .mesaj.tekrar { background: var(--warn-soft); color: var(--warn); }
  .liste { width: 100%; border-collapse: collapse; font-size: 14px; }
  .liste th, .liste td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .liste th { color: var(--muted); font-weight: 600; }
  .bos { color: var(--muted); }
  @media (max-width: 640px) {
    .profil, .alanlar { grid-template-columns: 1fr; }
    .izgara { grid-template-columns: 1fr 1fr; }
    .liste .gizle-mobil { display: none; }
  }
</style>
</head>
<body>
<div class="kap">
  <header>
    <h1>BAK 2026 Çıktı Künye – Veri Girişi</h1>
    <p>Kategori seçin, formu doldurun, “Kaydet”e basın. Kaydınız ilgili sayfaya otomatik eklenir.</p>
    <div class="demo" id="demo" hidden>Önizleme modu: Bu sayfa tabloya bağlı değil, girdiğiniz veriler kaydedilmez.</div>
  </header>

  <section class="panel" aria-labelledby="profilBaslik">
    <h2 id="profilBaslik">Bilgileriniz <span class="ipucu" style="font-weight:400">(bir kez girmeniz yeterli, tarayıcınız hatırlar)</span></h2>
    <div class="profil">
      <div><label for="pAd">Ad Soyad</label><input id="pAd" autocomplete="name" placeholder="Örn. Ayşe Yılmaz"></div>
      <div><label for="pBolum">Bölüm / Alt Birim</label><select id="pBolum"></select></div>
    </div>
  </section>

  <nav class="sekmeler" role="tablist">
    <button class="sekme" role="tab" id="sYeni" aria-selected="true">Yeni Kayıt</button>
    <button class="sekme" role="tab" id="sKayit" aria-selected="false">Girdiğim Kayıtlar</button>
  </nav>

  <main id="icerik"></main>
</div>

<script>
var VERI = <?!= semaJson ?>;
var SEMA = VERI.sema, BOLUMLER = VERI.bolumler;
var DEMO = !(window.google && google.script && google.script.run);

// ---- Sunucu çağrısı (demo modunda taklit edilir) ----
var demoKayitlar = [];
function sunucu(fn, args, ok, hata) {
  if (!DEMO) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { hata(e.message || String(e)); });
    r[fn].apply(r, args);
    return;
  }
  setTimeout(function () {
    if (fn === 'kaydet') {
      var s = semaBul(args[0]);
      var anahtar = s.tekrar && args[1][s.tekrar];
      var var_ = anahtar && demoKayitlar.filter(function (k) { return k.a === s.anahtar && k.t === anahtar.toLowerCase(); })[0];
      if (var_ && !args[2]) return ok({ durum: 'tekrar', sayfa: s.sayfa, satir: var_.satir });
      var satir = s.ilk + demoKayitlar.filter(function (k) { return k.sayfa === s.sayfa; }).length;
      demoKayitlar.push({ a: s.anahtar, t: (anahtar || '').toLowerCase(), sayfa: s.sayfa, satir: satir, kategori: s.baslik,
        simge: s.simge, ozet: args[1][s.tekrar || s.alanlar.filter(function (a) { return a.tip !== 'ad' && a.tip !== 'bolum'; })[0].sutun] || '',
        tarih: new Date().toLocaleDateString('tr-TR') });
      ok({ durum: 'tamam', sayfa: s.sayfa, satir: satir });
    } else if (fn === 'kayitlarim') {
      ok(demoKayitlar);
    }
  }, 500);
}

// ---- Yardımcılar ----
function $(id) { return document.getElementById(id); }
function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function semaBul(a) { return SEMA.filter(function (s) { return s.anahtar === a; })[0]; }
function sakla(k, v) { try { localStorage.setItem('bak_' + k, v); } catch (e) {} }
function oku(k) { try { return localStorage.getItem('bak_' + k) || ''; } catch (e) { return ''; } }
function trTarih(iso) { if (!iso) return ''; var p = iso.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
function secenekler(select, liste, bosMetin) {
  select.appendChild(el('option', { value: '', text: bosMetin || 'Seçiniz…' }));
  liste.forEach(function (o) {
    var v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o;
    select.appendChild(el('option', { value: v, text: t }));
  });
}

// ---- Profil ----
secenekler($('pBolum'), BOLUMLER);
$('pAd').value = oku('ad');
$('pBolum').value = oku('bolum');
$('pAd').addEventListener('input', function () { sakla('ad', this.value.trim()); });
$('pBolum').addEventListener('change', function () { sakla('bolum', this.value); });
if (DEMO) $('demo').hidden = false;

// ---- Sekmeler ----
function sekmeSec(id) {
  ['sYeni', 'sKayit'].forEach(function (s) { $(s).setAttribute('aria-selected', s === id ? 'true' : 'false'); });
  if (id === 'sYeni') kategoriler(); else kayitlarim();
}
$('sYeni').onclick = function () { sekmeSec('sYeni'); };
$('sKayit').onclick = function () { sekmeSec('sKayit'); };

// ---- Kategori ızgarası ----
function kategoriler() {
  var ic = $('icerik'); ic.innerHTML = '';
  var p = el('section', { class: 'panel' }, [el('h2', { text: 'Ne eklemek istiyorsunuz?' })]);
  var g = el('div', { class: 'izgara' });
  SEMA.forEach(function (s) {
    g.appendChild(el('button', { class: 'kart', onclick: function () { formAc(s.anahtar); } }, [
      el('span', { class: 's', text: s.simge }), el('b', { text: s.baslik }), el('span', { class: 'a', text: s.aciklama })
    ]));
  });
  p.appendChild(g); ic.appendChild(p);
}

// ---- Form ----
function formAc(anahtar, mesaj) {
  var s = semaBul(anahtar);
  var ic = $('icerik'); ic.innerHTML = '';
  var p = el('section', { class: 'panel' });
  p.appendChild(el('button', { class: 'geri', text: '← Tüm kategoriler', onclick: kategoriler }));
  p.appendChild(el('div', { class: 'form-baslik' }, [el('span', { class: 's', text: s.simge }), el('h2', { text: s.baslik })]));
  if (s.uyari) p.appendChild(el('div', { class: 'uyari', text: '⚠ ' + s.uyari }));
  if (s.enAzBiri) p.appendChild(el('div', { class: 'ipucu', text: 'Sayı alanlarından en az birini doldurunuz.' }));

  var form = el('form', { novalidate: true });
  var izgara = el('div', { class: 'alanlar' });
  s.alanlar.forEach(function (a) { izgara.appendChild(alanOlustur(a)); });
  form.appendChild(izgara);

  var mesajKutu = el('div', { 'aria-live': 'polite' });
  var kaydetBtn = el('button', { class: 'btn ana', type: 'submit', text: 'Kaydet' });
  form.appendChild(el('div', { class: 'butonlar' }, [
    kaydetBtn,
    el('button', { class: 'btn', type: 'button', text: 'Formu temizle', onclick: function () { formAc(anahtar); } })
  ]));
  form.appendChild(mesajKutu);

  // Koşullu alanlar
  function kosullariUygula() {
    s.alanlar.forEach(function (a) {
      if (!a.goster) return;
      var kutu = form.querySelector('[data-alan="' + a.sutun + '"]');
      var kaynak = form.querySelector('[name="' + a.goster.sutun + '"]');
      kutu.hidden = !(kaynak && kaynak.value === a.goster.deger);
    });
  }
  form.addEventListener('change', kosullariUygula);
  kosullariUygula();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var sonuc = topla(s, form);
    mesajKutu.innerHTML = '';
    if (sonuc.hatalar.length) {
      mesajKutu.appendChild(el('div', { class: 'mesaj hata', text: sonuc.hatalar.join(' ') }));
      var ilkHata = form.querySelector('.hata-alan input, .hata-alan select, .hata-alan textarea');
      if (ilkHata) ilkHata.focus();
      return;
    }
    gonder(s, sonuc.veri, false, kaydetBtn, mesajKutu);
  });

  p.appendChild(form);
  ic.appendChild(p);
  if (mesaj) mesajKutu.appendChild(mesaj);
  var ilk = form.querySelector('input:not([readonly]), select, textarea');
  if (ilk && !mesaj) ilk.focus();
}

function alanOlustur(a) {
  var ad = a.sutun || a.anahtar;
  var id = 'f_' + ad;
  var genis = a.tip === 'uzunMetin' || a.tip === 'tarihAraligi';
  var kutu = el('div', { class: 'alan' + (genis ? ' genis' : ''), 'data-alan': ad });
  var lbl = el('label', { for: id }, [a.etiket]);
  if (a.zorunlu) lbl.appendChild(el('span', { class: 'z', text: '*', 'aria-hidden': 'true' }));
  kutu.appendChild(lbl);
  var g;
  switch (a.tip) {
    case 'liste':
      g = el('select', { id: id, name: ad }); secenekler(g, a.secenekler); break;
    case 'bolum':
      g = el('select', { id: id, name: ad }); secenekler(g, BOLUMLER); g.value = $('pBolum').value; break;
    case 'yuzde':
      g = el('select', { id: id, name: ad });
      var y = []; for (var i = 0; i <= 100; i += 10) y.push({ v: i, t: '%' + i });
      secenekler(g, y); break;
    case 'uzunMetin':
      g = el('textarea', { id: id, name: ad, placeholder: a.ornek ? 'Örn. ' + a.ornek : '' }); break;
    case 'tarih':
      g = el('input', { id: id, name: ad, type: 'date' }); break;
    case 'sayi':
      g = el('input', { id: id, name: ad, type: 'number', min: '0', step: 'any', inputmode: 'decimal', placeholder: a.ornek ? 'Örn. ' + a.ornek : '' }); break;
    case 'ad':
      g = el('input', { id: id, name: ad, autocomplete: 'name', placeholder: 'Ad Soyad' }); g.value = $('pAd').value; break;
    case 'tarihAraligi':
      g = el('div', { class: 'aralik' }, [
        el('input', { id: id, name: ad + '_bas', type: 'date', 'aria-label': 'Başlangıç tarihi' }),
        el('span', { text: '–' }),
        el('input', { name: ad + '_bit', type: 'date', 'aria-label': 'Bitiş tarihi' })
      ]); break;
    default:
      g = el('input', { id: id, name: ad, type: 'text', placeholder: a.ornek ? 'Örn. ' + a.ornek : '' });
  }
  kutu.appendChild(g);
  if (a.ipucu) kutu.appendChild(el('div', { class: 'ipucu', text: a.ipucu }));
  return kutu;
}

function topla(s, form) {
  var veri = {}, hatalar = [];
  form.querySelectorAll('.hata-alan').forEach(function (k) { k.classList.remove('hata-alan'); });
  s.alanlar.forEach(function (a) {
    var ad = a.sutun || a.anahtar;
    var kutu = form.querySelector('[data-alan="' + ad + '"]');
    if (kutu.hidden) return;
    var v;
    if (a.tip === 'tarihAraligi') {
      var b = form.elements[ad + '_bas'].value, t = form.elements[ad + '_bit'].value;
      if (b && t && t < b) { hatalar.push('"' + a.etiket + '": bitiş tarihi başlangıçtan önce olamaz.'); kutu.classList.add('hata-alan'); }
      v = b ? (t && t !== b ? trTarih(b) + ' – ' + trTarih(t) : trTarih(b)) : '';
    } else {
      v = form.elements[ad].value.trim();
    }
    if (a.zorunlu && !v) { hatalar.push('"' + a.etiket + '" zorunludur.'); kutu.classList.add('hata-alan'); }
    veri[ad] = v;
  });
  if (s.enAzBiri && !s.enAzBiri.some(function (c) { return veri[c]; })) {
    hatalar.push('En az bir sayı alanını doldurunuz.');
    s.enAzBiri.forEach(function (c) { form.querySelector('[data-alan="' + c + '"]').classList.add('hata-alan'); });
  }
  // Başlama/bitiş tarihi tutarlılığı (ör. projeler, burslar)
  var tarihler = s.alanlar.filter(function (a) { return a.tip === 'tarih'; });
  for (var i = 0; i + 1 < tarihler.length; i++) {
    var b1 = veri[tarihler[i].sutun], b2 = veri[tarihler[i + 1].sutun];
    if (/Başla|Başvuru/.test(tarihler[i].etiket) && b1 && b2 && b2 < b1) {
      hatalar.push('"' + tarihler[i + 1].etiket + '", "' + tarihler[i].etiket + '"nden önce olamaz.');
      form.querySelector('[data-alan="' + tarihler[i + 1].sutun + '"]').classList.add('hata-alan');
    }
  }
  return { veri: veri, hatalar: hatalar };
}

function gonder(s, veri, zorla, btn, mesajKutu) {
  btn.disabled = true; btn.textContent = 'Kaydediliyor…';
  sunucu('kaydet', [s.anahtar, veri, zorla], function (r) {
    btn.disabled = false; btn.textContent = 'Kaydet';
    mesajKutu.innerHTML = '';
    if (r.durum === 'tekrar') {
      mesajKutu.appendChild(el('div', { class: 'mesaj tekrar' }, [
        el('div', { text: 'Bu başlıkla bir kayıt zaten var (“' + r.sayfa + '” sayfası, ' + r.satir + '. satır). Aynı kaydı iki kez girmiş olabilirsiniz.' }),
        el('div', { class: 'butonlar' }, [
          el('button', { class: 'btn', type: 'button', text: 'Yine de kaydet', onclick: function () { gonder(s, veri, true, btn, mesajKutu); } }),
          el('button', { class: 'btn', type: 'button', text: 'Vazgeç', onclick: function () { mesajKutu.innerHTML = ''; } })
        ])
      ]));
      return;
    }
    var ok = el('div', { class: 'mesaj ok' }, [
      el('div', { html: '<b>✓ Kaydedildi.</b> “' + r.sayfa.replace(/</g, '&lt;') + '” sayfası, ' + r.satir + '. satır.' }),
      el('div', { class: 'butonlar' }, [
        el('button', { class: 'btn ana', type: 'button', text: 'Aynı türde yeni kayıt', onclick: function () { formAc(s.anahtar); } }),
        el('button', { class: 'btn', type: 'button', text: 'Başka kategori', onclick: kategoriler })
      ])
    ]);
    formAc(s.anahtar, ok);
    $('icerik').scrollIntoView({ behavior: 'smooth' });
  }, function (hata) {
    btn.disabled = false; btn.textContent = 'Kaydet';
    mesajKutu.innerHTML = '';
    mesajKutu.appendChild(el('div', { class: 'mesaj hata', text: 'Kaydedilemedi: ' + hata }));
  });
}

// ---- Girdiğim kayıtlar ----
function kayitlarim() {
  var ic = $('icerik'); ic.innerHTML = '';
  var p = el('section', { class: 'panel' }, [el('h2', { text: 'Girdiğim Kayıtlar' })]);
  ic.appendChild(p);
  var ad = $('pAd').value.trim();
  if (!ad) { p.appendChild(el('p', { class: 'bos', text: 'Kayıtlarınızı görmek için yukarıya adınızı soyadınızı yazınız.' })); return; }
  var yukleniyor = el('p', { class: 'bos', text: 'Yükleniyor…' });
  p.appendChild(yukleniyor);
  sunucu('kayitlarim', [ad], function (liste) {
    yukleniyor.remove();
    if (!liste.length) { p.appendChild(el('p', { class: 'bos', text: '“' + ad + '” adına kayıt bulunamadı.' })); return; }
    var t = el('table', { class: 'liste' });
    t.appendChild(el('thead', {}, [el('tr', {}, [
      el('th', { text: 'Kategori' }), el('th', { text: 'Başlık / Özet' }),
      el('th', { class: 'gizle-mobil', text: 'Satır' }), el('th', { class: 'gizle-mobil', text: 'Giriş tarihi' })
    ])]));
    var tb = el('tbody');
    liste.forEach(function (k) {
      tb.appendChild(el('tr', {}, [
        el('td', { text: k.simge + ' ' + k.kategori }), el('td', { text: k.ozet }),
        el('td', { class: 'gizle-mobil', text: k.satir }), el('td', { class: 'gizle-mobil', text: k.tarih })
      ]));
    });
    t.appendChild(tb); p.appendChild(t);
    p.appendChild(el('p', { class: 'ipucu', text: 'Düzeltme veya silme için bölüm sorumlusuna başvurunuz.' }));
  }, function (h) { yukleniyor.textContent = 'Kayıtlar alınamadı: ' + h; });
}

kategoriler();
</script>
</body>
</html>
